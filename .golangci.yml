version: "2"

run:
  timeout: 5m
  # Test files are guarded by these tags (unit/integration for the service
  # tests, smoke for the compose smoke suite). Without them golangci-lint skips
  # those files entirely, so they escaped gocyclo, unused, godot and the rest.
  # This one setting applies to CI, `task lint` and local runs alike.
  build-tags:
    - unit
    - integration
    - smoke

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gocyclo
    - godot
  disable:
    - exhaustruct
    - exhaustive
    - funlen
    - wsl
    - nlreturn
    - godox
    - paralleltest
    - testpackage
    - varnamelen
  settings:
    gocyclo:
      min-complexity: 7
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: docs/docs\.go
        linters:
          - godot
      - source: "// @"
        linters:
          - godot

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ocrosby/identity-platform-go
