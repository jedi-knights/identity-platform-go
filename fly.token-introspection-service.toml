# Fly.io config for token-introspection-service. Deploy: fly deploy -c fly.token-introspection-service.toml
# Private app; in-memory revocation store for the Phase 1 deployment
# (state loss on restart is accepted while customer count is 1–3). Set
# INTROSPECT_REDIS_URL via `fly secrets set` and re-enable
# INTROSPECT_LOG_ENVIRONMENT = "production" to switch to the Redis path
# per ADR-0004. Shares JWT signing key with auth-server via the JWKS
# URL below.

app            = "jk-token-introspection-service"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    SERVICE_NAME = "token-introspection-service"

[env]
  # Bind IPv6 so the app is reachable on Fly's .internal (6PN) network.
  INTROSPECT_SERVER_HOST     = "[::]"
  INTROSPECT_SERVER_PORT     = "8083"
  INTROSPECT_LOG_FORMAT      = "json"
  INTROSPECT_LOG_LEVEL       = "info"
  # INTROSPECT_LOG_ENVIRONMENT deliberately unset — triggers the
  # ADR-0004 in-memory revocation store. To switch to the Redis-backed
  # store, set INTROSPECT_LOG_ENVIRONMENT = "production" and
  # INTROSPECT_REDIS_URL.
  INTROSPECT_JWT_ISSUER = "identity-platform"
  # Fetch the public signing keys from auth-server over 6PN. The JWKS
  # endpoint is unauthenticated per RFC 7517 and the response is cached
  # by the service for 1h, so auth-server does not need to be up at
  # every request.
  INTROSPECT_JWT_JWKS_URL = "http://jk-auth-server.internal:8080/.well-known/jwks.json"

[checks]
  [checks.health]
    type         = "http"
    port         = 8083
    path         = "/health"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

# Prometheus scrape target per the fleet-wide observability strategy.
# The service exposes /metrics on :9464 (OTel's conventional port) via
# go-platform/httpserver so Fly's hosted Prometheus can pull Go runtime
# + OTel contrib runtime instrumentation metrics plus any
# service-registered counters without routing through the main HTTP
# mux's auth/CORS stack.
[metrics]
  port = 9464
  path = "/metrics"
