# Fly.io config for auth-server. Deploy: fly deploy -c fly.auth-server.toml
# Public app — external customers fetch access tokens via POST /oauth/token
# and verify signatures via GET /.well-known/jwks.json. Other apps in the
# same org still reach it over .internal:8080 when that's cheaper than the
# public path; both work off the same listener.

app            = "jk-auth-server"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    SERVICE_NAME = "auth-server"

[env]
  # Bind IPv6 so the app is reachable on Fly's .internal (6PN) network.
  # The service defaults to 0.0.0.0 (IPv4-only), which .internal cannot reach.
  AUTH_SERVER_HOST       = "[::]"
  AUTH_SERVER_PORT       = "8080"
  AUTH_LOG_FORMAT        = "json"
  AUTH_LOG_LEVEL         = "info"
  # AUTH_LOG_ENVIRONMENT deliberately unset — triggers the ADR-0004
  # in-memory fallback. The ADR-0029 startup guard keys on this value;
  # leaving it blank keeps auth-server running without a Redis token
  # store. State is lost on machine restart, which is acceptable for
  # the current pre-validation deployment (1–3 design partners) and
  # reversible: set AUTH_LOG_ENVIRONMENT = "production" and
  # AUTH_REDIS_URL via fly secrets when HA is wanted.
  AUTH_JWT_ISSUER        = "identity-platform"
  AUTH_TOKEN_TTL_SECONDS = "3600"
  # OIDC + RFC 8414 metadata (ADR-0010 / ADR-0012). Both must be set for
  # /.well-known/openid-configuration and /.well-known/oauth-authorization-server
  # to register — the metadata handler returns nil when PublicBaseURL is empty,
  # and OIDC mode is disabled when OIDCIssuer is empty. The public base is the
  # gateway's hostname (clients reach the AS through jk-api-gateway).
  AUTH_METADATA_PUBLIC_BASE_URL = "https://jk-api-gateway.fly.dev"
  AUTH_JWT_OIDC_ISSUER          = "https://jk-api-gateway.fly.dev"
  # No dev client seeding. AUTH_CLIENT_REGISTRY_URL is set so auth-server
  # delegates client validation to client-registry-service; register real
  # clients via that service's POST /clients endpoint.
  AUTH_DEV_SEED_CLIENTS    = "false"
  AUTH_CLIENT_REGISTRY_URL = "http://jk-client-registry-service.internal:8082"
  # AUTH_IDENTITY_SERVICE_URL and AUTH_ENTITLEMENTS_SERVICE_URL are
  # deliberately omitted here: Phase 1 deploys only auth-server +
  # client-registry-service + token-introspection-service, serving
  # client_credentials grants for a machine-to-machine consumer
  # (cutline). identity-service (OIDC authorization_code) and
  # entitlements-service (plan_ids claim stamping) are not reachable;
  # auth-server treats both URLs as nil-safe and falls back to the
  # non-federated paths.

# Public HTTP routing. Phase 1 posture: auto_stop_machines = "stop" keeps
# the bill at ~$0 during idle windows; auth-server is hit infrequently
# enough that cold-start latency on the first token request is acceptable.
# force_https redirects http://jk-auth-server.fly.dev/* → https automatically.
[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["app"]

  # Fly's edge-level HTTP check runs at the same cadence/timeout as the
  # previous [checks] block; moved under http_service so a failed probe
  # pulls the machine out of the load balancer in addition to failing
  # the machine-level health status.
  [[http_service.checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"
    path         = "/health"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

# Prometheus scrape target per the fleet-wide observability strategy.
# The service exposes /metrics on :9464 (OTel's conventional port) via
# go-platform/httpserver so Fly's hosted Prometheus can pull Go runtime
# + OTel contrib runtime instrumentation metrics plus any
# service-registered counters without routing through the main HTTP
# mux's auth/CORS stack.
[metrics]
  port = 9464
  path = "/metrics"
