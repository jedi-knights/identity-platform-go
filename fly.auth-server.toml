# Fly.io config for auth-server. Deploy: fly deploy -c fly.auth-server.toml
# Private app (no [http_service]/public IP); reached by the gateway over .internal.

app            = "jk-auth-server"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    SERVICE_NAME = "auth-server"

[env]
  # Bind IPv6 so the app is reachable on Fly's .internal (6PN) network.
  # The service defaults to 0.0.0.0 (IPv4-only), which .internal cannot reach.
  AUTH_SERVER_HOST          = "[::]"
  AUTH_SERVER_PORT          = "8080"
  AUTH_LOG_FORMAT           = "json"
  AUTH_LOG_LEVEL            = "info"
  AUTH_LOG_ENVIRONMENT      = "production"
  AUTH_JWT_ISSUER           = "identity-platform"
  AUTH_TOKEN_TTL_SECONDS    = "3600"
  # OIDC + RFC 8414 metadata (ADR-0010 / ADR-0012). Both must be set for
  # /.well-known/openid-configuration and /.well-known/oauth-authorization-server
  # to register — the metadata handler returns nil when PublicBaseURL is empty,
  # and OIDC mode is disabled when OIDCIssuer is empty. The public base is the
  # gateway's hostname (clients reach the AS through jk-api-gateway).
  AUTH_METADATA_PUBLIC_BASE_URL = "https://jk-api-gateway.fly.dev"
  AUTH_JWT_OIDC_ISSUER          = "https://jk-api-gateway.fly.dev"
  # No dev client seeding in production. Also a no-op while AUTH_CLIENT_REGISTRY_URL
  # is set (auth-server delegates client validation to client-registry-service);
  # register real clients via client-registry-service's POST /clients.
  AUTH_DEV_SEED_CLIENTS     = "false"
  # Inter-service URLs over the private network.
  AUTH_CLIENT_REGISTRY_URL  = "http://jk-client-registry-service.internal:8082"
  AUTH_IDENTITY_SERVICE_URL = "http://jk-identity-service.internal:8081"

# Machine-level health check (no public routing required).
[checks]
  [checks.health]
    type         = "http"
    port         = 8080
    path         = "/health"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

# Prometheus scrape target per the fleet-wide observability strategy.
# The service exposes /metrics on :9464 (OTel's conventional port) via
# go-platform/httpserver so Fly's hosted Prometheus can pull Go runtime
# + OTel contrib runtime instrumentation metrics plus any
# service-registered counters without routing through the main HTTP
# mux's auth/CORS stack.
[metrics]
  port = 9464
  path = "/metrics"
