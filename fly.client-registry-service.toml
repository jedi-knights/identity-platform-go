# Fly.io config for client-registry-service. Deploy: fly deploy -c fly.client-registry-service.toml
# Private app; in-memory client store for the Phase 1 deployment (state
# loss on restart is accepted while customer count is 1–3). Set
# CLIENT_DATABASE_URL via `fly mpg attach` and re-enable
# CLIENT_LOG_ENVIRONMENT = "production" to switch to the Postgres path
# per ADR-0004.

app            = "jk-client-registry-service"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    SERVICE_NAME = "client-registry-service"

[env]
  # Bind IPv6 so the app is reachable on Fly's .internal (6PN) network.
  CLIENT_SERVER_HOST     = "[::]"
  CLIENT_SERVER_PORT     = "8082"
  CLIENT_LOG_FORMAT      = "json"
  CLIENT_LOG_LEVEL       = "info"
  # CLIENT_LOG_ENVIRONMENT deliberately unset — triggers the ADR-0004
  # in-memory client store (state loss on restart is accepted for
  # Phase 1). To switch to the Postgres-backed store, set
  # CLIENT_LOG_ENVIRONMENT = "production" and CLIENT_DATABASE_URL.

[checks]
  [checks.health]
    type         = "http"
    port         = 8082
    path         = "/health"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

# Prometheus scrape target per the fleet-wide observability strategy.
# The service exposes /metrics on :9464 (OTel's conventional port) via
# go-platform/httpserver so Fly's hosted Prometheus can pull Go runtime
# + OTel contrib runtime instrumentation metrics plus any
# service-registered counters without routing through the main HTTP
# mux's auth/CORS stack.
[metrics]
  port = 9464
  path = "/metrics"
