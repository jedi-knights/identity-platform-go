name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/auth-server
          - services/authorization-policy-service
          - services/client-registry-service
          - services/example-resource-service
          - services/identity-service
          - services/login-ui
          - services/token-introspection-service
          - test/acceptance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Run golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          # Pinned to match Taskfile.yml's install-tools. `latest` let a new
          # errcheck release fail CI while local v2.11.4 passed. Bump both together.
          version: v2.15.0
          args: --timeout=5m
          working-directory: ${{ matrix.module }}

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests
        run: |
          find . -name "go.mod" -not -path "*/vendor/*" | while read modfile; do
            dir=$(dirname "$modfile")
            echo "=== Testing $dir ==="
            (cd "$dir" && go test -tags unit ./... -race -count=1) || exit 1
          done

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Postgres adapter tests skip themselves unless TEST_DATABASE_URL (or
    # ENTITLEMENTS_POSTGRES_TEST_URL) is set, so without this service they never
    # ran in CI. The job is ephemeral, so the throwaway credentials are fine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run integration tests
        env:
          PG_URL_BASE: postgres://postgres:postgres@localhost:5432
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          find . -name "go.mod" -not -path "*/vendor/*" | sort | while read modfile; do
            dir=$(dirname "$modfile")
            # One database per module: each service owns its own migration
            # history (schema_migrations), so sharing a database would collide.
            db=$(basename "$dir" | tr '-' '_')_test
            psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE \"$db\"" || exit 1
            echo "=== Testing $dir ==="
            (cd "$dir" && \
              TEST_DATABASE_URL="$PG_URL_BASE/$db?sslmode=disable" \
              ENTITLEMENTS_POSTGRES_TEST_URL="$PG_URL_BASE/$db?sslmode=disable" \
              go test -tags integration ./... -race -count=1) || exit 1
          done

  test-acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run acceptance tests
        # No `services:` block needed — testcontainers-go talks to the
        # Docker socket already present on GitHub-hosted runners to start
        # the one shared Redis container this suite needs.
        run: cd test/acceptance && go test -tags acceptance ./... -count=1
