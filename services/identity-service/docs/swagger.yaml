host: localhost:8081
info:
  contact: {}
  description: User registration and authentication service.
  title: Identity Service API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ocrosby_identity-platform-go_services_identity-service_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ocrosby_identity-platform-go_services_identity-service_internal_domain.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Authenticate user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user with email, password, and name
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ocrosby_identity-platform-go_services_identity-service_internal_domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ocrosby_identity-platform-go_services_identity-service_internal_domain.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /auth/request-verification:
    post:
      consumes:
      - application/json
      description: Sends a verification email to the address on the request. Always
        returns 204 to prevent user enumeration.
      parameters:
      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ocrosby_identity-platform-go_services_identity-service_internal_domain.RequestVerificationRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Request a verification email
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Redeems a one-time verification token and marks the user verified.
      parameters:
      - description: Verification token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ocrosby_identity-platform-go_services_identity-service_internal_domain.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ocrosby_identity-platform-go_services_identity-service_internal_domain.VerifyEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Verify an email address
      tags:
      - auth
  /health:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /users/{id}/active-account:
    get:
      description: Returns the currently selected account for the user. account_id
        is null when the user has never chosen.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Requester user ID (must equal path id)
        in: header
        name: X-Requester-User-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_inbound_http.activeAccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Get the user's active account
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Upserts the currently selected account for the user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Requester user ID (must equal path id)
        in: header
        name: X-Requester-User-ID
        required: true
        type: string
      - description: Active account selection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_http.setActiveAccountRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Set the user's active account
      tags:
      - users
  /users/{id}/claims:
    get:
      description: Returns OIDC Core §5.1 claim projection for the user with the given
        id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ocrosby_identity-platform-go_services_identity-service_internal_domain.UserClaims'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Get user OIDC claims
      tags:
      - users
swagger: "2.0"
