<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Reset password</title>
</head>
<body>
  <h1>Reset your password</h1>
  {{if .Done}}
  <p data-testid="done">Your password has been updated. Return to the app you were signing in to and sign in with your new password.</p>
  {{else}}
  {{if .Error}}<p role="alert" data-testid="error">{{.Error}}{{if .OfferNewLink}} <a href="/forgot-password" data-testid="link-forgot">Request a new link</a>.{{end}}</p>{{end}}
  {{if .Token}}
  <form method="POST" action="/reset-password" data-testid="reset-form">
    <input type="hidden" name="token" value="{{.Token}}">
    <label>New password <input type="password" name="password" required autocomplete="new-password" data-testid="password"></label>
    <label>Confirm new password <input type="password" name="confirm_password" required autocomplete="new-password" data-testid="confirm-password"></label>
    <button type="submit" data-testid="submit">Reset password</button>
  </form>
  {{end}}
  {{end}}
</body>
</html>
